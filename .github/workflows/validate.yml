name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structural-and-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural check (manifests + frontmatter)
        run: python3 scripts/structural-check.py
      - name: Advisory-hook contract tests
        run: python3 evals/hooks/test_hooks.py
